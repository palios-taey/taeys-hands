# Canonical GTK native file-dialog identity. Observation authority is the
# per-display AT-SPI tree, never the X11 active-window title.
native_file_dialog:
  root:
    role: file chooser
    uniqueness: exactly_one_application_child
  mapped:
    file_chooser_root:
      role: file chooser
      application_child: true
    file_chooser_widget:
      name: File Chooser Widget
      role: file chooser
    location_layer:
      name: Location Layer
      role: filler
    location_entry:
      name: ""
      role: text
      ancestor:
        name: Location Layer
        role: filler
