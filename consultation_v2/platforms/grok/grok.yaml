platform: grok
click_strategy: atspi_only
urls:
  fresh: https://grok.com/
  verify_navigation: true
native_dialog:
  schema: native_dialog_v1
  root: dialog_root
  max_depth: 32
  elements:
    dialog_root:
      role: file chooser
      scope: firefox_application.direct_child
      capture_name: true
      structural:
        relation: direct_child
        parent_scope: firefox_application
      required_states:
        - showing
        - visible
        - enabled
        - active
    chooser_widget:
      name: File Chooser Widget
      role: file chooser
      scope: native_dialog.chooser
      structural:
        relation: descendant
        anchor: dialog_root
      required_states:
        - showing
        - visible
        - enabled
    location_layer:
      name: Location Layer
      role: filler
      scope: native_dialog.location
      structural:
        relation: descendant
        anchor: chooser_widget
      required: false
      required_states:
        - showing
        - visible
        - enabled
    location_entry:
      name_absent: true
      role: text
      scope: native_dialog.location
      structural:
        relation: direct_child
        anchor: location_layer
      required: false
      capture_text: true
      required_states:
        - showing
        - visible
        - enabled
        - focusable
        - focused
        - editable
    cancel_button:
      name: Cancel
      role: push button
      scope: native_dialog.actions
      structural:
        relation: descendant
        anchor: dialog_root
      required_states:
        - showing
        - visible
        - enabled
        - focusable
    open_button:
      name: Open
      role: push button
      scope: native_dialog.actions
      structural:
        relation: descendant
        anchor: dialog_root
      required_states:
        - showing
        - visible
        - enabled
        - focusable
tree:
  fence_after: []
  menu_snapshot_roles:
    - menu item
    - radio menu item
    - check menu item
    - option
  menu_snapshot_exclude:
    names:
    - Undo
    - Redo
    - Cut
    - Copy
    - Paste
    - Paste Without Formatting
    - Delete
    - Select All
    - Check Spelling
    - Inspect
  exclude:
    names:
    - Toggle Sidebar
    - pfp
    - Web page favicon
    - Markdown
    roles:
    - separator
    - document web
    - list item
    - paragraph
    - image
  sidebar_nav:
  - name: Home page
    role: link
  - name: Search
    role: push button
  - name: Chat
    role: link
  - name: Voice
    role: link
  - name: Imagine
    role: link
  - name: Projects
    role: push button
  - name: History
    role: push button
  element_map:
    # --- composer / input (document snapshot, LIVE-CONFIRMED :5 2026-06-03) ---
    # The composer is exposed as role "entry" with name "Ask Grok anything"
    # (states editable, focusable, focused, multi line). Prompt entry + send
    # (focus this entry + Enter) both key off this. Matched EXACTLY.
    input:
      name: "Ask Grok anything"
      role: entry
    # --- toolbar push buttons (document snapshot, EXACT from live scan :5 2026-06-03) ---
    attach_trigger:
      name: Attach
      role: push button
    model_selector:
      name: Model select
      role: push button
    new_chat:
      name: New Chat
      role: link
    # send button (LIVE-CONFIRMED :5 2026-06-03). The composer is MULTI-LINE, so
    # Enter inserts a newline — submit is THIS exact push button, not a keystroke.
    send_button:
      name: "Submit"
      role: push button
    copy_button:
      name: "Copy response"
      role: push button
    regenerate:
      name: Regenerate
      role: push button
    usage_limit_updated_alert:
      role: alert
      states_include:
        - showing
        - enabled
      child_texts:
        - Your usage limit has been updated
        - You can keep going now.
        - Retry
    retry_button:
      name: Retry
      role: push button
    like:
      name: Like
      role: push button
    dislike:
      name: Dislike
      role: push button
    more_actions:
      name: More actions
      role: push button
    create_share_link:
      name: Create share link
      role: push button
    search:
      name: Search
      role: push button
    history:
      name: History
      role: push button
    dictation:
      name: Dictation (Ctrl+D)
      role: push button
    voice_mode:
      name: Enter voice mode (Ctrl+⇧O)
      role: push button
    # --- generating-state stop button (EXACT per 100_TIMES §1) ---
    stop_button:
      name: Stop model response
      role: push button
    # --- model/mode dropdown items (live app-root after clicking Model select) ---
    model_auto:
      name: "Auto Chooses Fast or Expert"
      role: radio menu item
      scope: app_root_snapshot
    model_fast:
      name: "Fast Quick responses · Grok 4.5"
      role: radio menu item
      scope: app_root_snapshot
    model_expert:
      name: "Expert Thinks hard · Grok 4.5"
      role: radio menu item
      scope: app_root_snapshot
    model_heavy:
      name: "Heavy Team of Experts · Grok 4.5"
      role: radio menu item
      scope: app_root_snapshot
    # --- attach dropdown item (menu_snapshot after clicking Attach) ---
    upload_files_item:
      name: "Upload a file"
      role: menu item
    recent_item:
      name: Recent
      role: menu item
    skills_item:
      name: Skills
      role: menu item
    connectors_item:
      name: Connectors
      role: menu item
    # --- uploaded file chip (LIVE-CONFIRMED on :5 2026-06-03). The chip's
    # accessible name is STATIC ("Open attachment Remove this attachment"), NOT
    # the filename, so it is matched EXACTLY — no structural locator needed.
    # Exposed in the DOCUMENT scope (not a React portal).
    uploaded_file_chip:
      name: "Open attachment Remove this attachment"
      role: list item
    # Static remove button — persistent, exact, present iff a file is attached.
    # This is the attach-present indicator (doc scope).
    remove_attachment:
      name: "Remove this attachment"
      role: push button
workflow:
  defaults:
    model: null
    mode: null
    tools: []
  full_consult:
    steps:
      attach_trigger:
        elements:
          - attach_trigger
      upload_item:
        elements:
          - upload_files_item
      composer_input:
        elements:
          - input
      submit:
        elements:
          - send_button
      completion:
        elements:
          - stop_button
      copy_response:
        elements:
          - copy_button
        pick: last_by_y
        settle_seconds: 1.0
    attachment_present:
      elements:
        - remove_attachment
    select_mode:
      - menu: model
        option: heavy
  # Compatibility alias for older contract checks; the driver reads the same
  # mapping from workflow.selection.mode_targets.
  mode_targets:
    auto: model_auto
    fast: model_fast
    expert: model_expert
    heavy: model_heavy
  selection:
    menus:
      model:
        select: single
        active_recognition: click_only
        must_choose: true
        resettable_on_followup: true
        operate:
          trigger: model_selector
          scope: app_root_snapshot
          open_method: focus_and_key_open
          open_key: space
        options:
          auto:
            element: model_auto
            click_strategy: atspi_only
          expert:
            element: model_expert
            click_strategy: atspi_only
          fast:
            element: model_fast
            click_strategy: atspi_only
          heavy:
            element: model_heavy
            click_strategy: atspi_only
        default_for_fresh: auto
        example_rationale: Use Auto when the caller wants Grok to choose between Fast and Expert for this consult.
  navigate:
    new_chat_key: new_chat
    fresh_input_key: input
  attachment:
    trigger: attach_trigger
    menu_target: upload_files_item
    scope: menu_snapshot
    open_method: focus_and_key_open
    open_key: space
  prompt:
    input: input
  send:
    # Multi-line composer: submit by clicking the exact send_button, NOT Enter.
    send_key: send_button
    stop_key: stop_button
  post_send:
    exceptions:
      usage_limit_updated:
        detect:
          - usage_limit_updated_alert
          - retry_button
        recovery:
          action: click
          element: retry_button
          max_attempts: 1
          success_element: stop_button
          url_prefix: https://grok.com/c/
  post_action_transitions:
    usage_limit_retry:
      source_exception: usage_limit_updated
      observation:
        surface: browser
        scope: snapshot
        refresh_policy: invalidate_reacquire
        consecutive_matches: 2
        timeout_ms: 2000
        interval_ms: 200
  monitor:
    stop_key: stop_button
    generation_timeout: 3600
  extract:
    primary_key: copy_button
validation:
  # mode_active: gate on the dropdown menu item carrying a selected/checked
  # state. Read ONLY inside an opened model dropdown (menu_snapshot), since the
  # persistent "Model select" button name does not expose the active model.
  auto_active:
    indicators:
    - name: "Auto Chooses Fast or Expert"
      role: radio menu item
      states_include:
      - checked
  fast_active:
    indicators:
    - name: "Fast Quick responses · Grok 4.5"
      role: radio menu item
      states_include:
      - checked
  expert_active:
    indicators:
    - name: "Expert Thinks hard · Grok 4.5"
      role: radio menu item
      states_include:
      - checked
  heavy_active:
    indicators:
    - name: "Heavy Team of Experts · Grok 4.5"
      role: radio menu item
      states_include:
      - checked
  # attach_present: presence of the static remove button (doc scope). Its name
  # is static (the filename is dynamic, the button name is not), so it is an
  # EXACT indicator — no structural locator. LIVE-CONFIRMED on :5 2026-06-03.
  attach_present:
    indicators:
    - name: "Remove this attachment"
      role: push button
  # send_fired: the stop button is present (generating).
  send_fired:
    stop_present: stop_button
  # response_complete: the stop button is GONE (persistent-element gate).
  response_complete:
    stop_absent: stop_button
settle:
  default_ms: 2000
  selection_ms: 8000
  navigate_ms: 4000
  new_chat_ms: 60000
  attach_ms: 3000
  rescan_attempts: 1

# ============================================================================
# extraction — output-type -> ordered exact-matched workflow.
# Schema + load-time validation: consultation_v2/yaml_contract.py;
# grammar doc: consultation_v2/EXTRACTION_SCHEMA.md.
# assistant_text uses the exact last mapped `copy_button` after
# scroll-to-bottom. Image generation is a separate surface and is not part of
# this Chat consultation YAML.
# ============================================================================
extraction:
  assistant_text:
    steps:
      - action: scroll_to_bottom
        element: copy_button
      - action: copy_element
        element: copy_button
        select: last
      - action: read_clipboard
        validation: response_complete
