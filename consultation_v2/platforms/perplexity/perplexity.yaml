platform: perplexity
click_strategy: atspi_only
urls:
  fresh: https://www.perplexity.ai/
  verify_navigation: false
native_dialog:
  schema: native_dialog_v1
  root: dialog_root
  max_depth: 32
  elements:
    dialog_root:
      role: file chooser
      scope: firefox_application.direct_child
      capture_name: true
      structural:
        relation: direct_child
        parent_scope: firefox_application
      required_states:
        - showing
        - visible
        - enabled
        - active
    chooser_widget:
      name: File Chooser Widget
      role: file chooser
      scope: native_dialog.chooser
      structural:
        relation: descendant
        anchor: dialog_root
      required_states:
        - showing
        - visible
        - enabled
    location_layer:
      name: Location Layer
      role: filler
      scope: native_dialog.location
      structural:
        relation: descendant
        anchor: chooser_widget
      required: false
      required_states:
        - showing
        - visible
        - enabled
    location_entry:
      name_absent: true
      role: text
      scope: native_dialog.location
      structural:
        relation: direct_child
        anchor: location_layer
      required: false
      capture_text: true
      required_states:
        - showing
        - visible
        - enabled
        - focusable
        - focused
        - editable
    cancel_button:
      name: Cancel
      role: push button
      scope: native_dialog.actions
      structural:
        relation: descendant
        anchor: dialog_root
      required_states:
        - showing
        - visible
        - enabled
        - focusable
    open_button:
      name: Open
      role: push button
      scope: native_dialog.actions
      structural:
        relation: descendant
        anchor: dialog_root
      required_states:
        - showing
        - visible
        - enabled
        - focusable
tree:
  # fence_after disabled — Deep Research and input controls appear AFTER
  # sidebar history in AT-SPI tree. Fencing cuts them off.
  fence_after: []
  menu_snapshot_roles:
    - menu item
    - radio menu item
    - check menu item
    - option
  menu_snapshot_exclude:
    names:
    - Undo
    - Redo
    - Cut
    - Copy
    - Paste
    - Paste Without Formatting
    - Delete
    - Select All
    - Check Spelling
    - Inspect
  exclude:
    names:
    - User avatar
    - Upgrade to Pro
    roles:
    - separator
    - document web
    - paragraph
    - landmark
  sidebar_nav:
  - name: Search
    role: link
  - name: Computer
    role: link
  - name: New Thread
    role: push button
  - name: History
    role: link
  - name: Discover
    role: link
  - name: Spaces
    role: link
  - name: Finance
    role: link
  - name: More
    role: push button
  element_map:
    # ─── Toolbar / persistent controls ───────────────────────────────────────
    input:
      role: entry
      states_include:
      - editable
      match_strategy: name_agnostic_structural
      structural:
        before: attach_trigger
      reason: Perplexity's composer entry is nameless; the Submit button is absent on an empty composer (it appears only after text entry), so anchor the editable page entry before the always-present "Add files or tools" trigger that sits just below the composer (composer y<attach y).
    input_message:
      name: Message
      role: entry
      states_include:
      - editable
    attach_trigger:
      name: Add files or tools
      role: push button
    new_thread:
      name: New thread Ctrl I
      role: push button
    new_thread_link:
      name: New
      role: link
    dictation:
      name: Dictation
      role: push button
    voice_mode:
      name: Use voice mode
      role: push button
    computer_ready:
      name: "Your Computer is ready"
      role: push button
    computer_personalize:
      name: Personalize Computer
      role: push button
    computer_notifications:
      name: Turn on notifications
      role: push button
    notifications:
      name: Notifications
      role: push button
    scheduled:
      name: Scheduled
      role: push button
    incognito:
      name: "Use incognito: create anonymous threads that aren't saved to your history and expire after 24 hours"
      role: push button
    # ─── Mode tiles (toolbar chips next to "+" attach button) ─────────────
    # The current mode is a pressed toolbar toggle. Focus the exact toggle and
    # press Space to open the mode menu; the selected mode then appears as its
    # own pressed toggle in the base tree.
    deep_research_toggle:
      name: Deep research
      role: toggle button
      states_include:
      - pressed
    search_mode_trigger:
      name: Search
      role: toggle button
      states_include:
      - pressed
    search_mode_option:
      name: Search
      role: radio menu item
    computer_mode:
      name: Computer
      role: push button
    suggestion_tabs:
      name: Primer query categories
      role: page tab list
    suggestion_tab_for_you:
      name: For you
      role: page tab

    # ─── Attach dropdown (Firefox root / portal — use menu_snapshot()) ────────
    upload_files_item:
      name: "Upload files or images"
      role: menu item
    git_connector_item:
      name: Connectors
      role: menu item
    spaces_item:
      name: Spaces
      role: menu item
    # radio menu items — Search mode dropdown
    computer_dropdown:
      name: Computer
      role: toggle button
    deep_research:
      name: Deep research
      role: radio menu item
    tool_model_council:
      name: "Model council Max"
      role: radio menu item
    # "More" sub-menu trigger inside attach dropdown
    attach_more_trigger:
      name: More
      role: menu item
    # "More" sub-menu items (Firefox root — use menu_snapshot())
    mode_create_files:
      name: "Create files and apps"
      role: radio menu item
    mode_learn:
      name: "Learn step by step"
      role: radio menu item

    # ─── Persistent toolbar indicators (presence = mode active) ──────────
    model_council_indicator:
      name: "Model council"
      role: push button
    create_files_indicator:
      name: "Create files and apps"
      role: push button
    learn_step_indicator:
      name: "Learn step by step"
      role: push button

    # ─── Connectors and sources panel (Firefox root — use menu_snapshot()) ───
    search_sources:
      name: "Search sources"
      role: entry
      states_include:
      - editable
    clear_search:
      name: Clear
      role: push button
    # Source toggles (check menu items)
    source_web:
      name: "Web"
      role: check menu item
    source_academic:
      name: "Academic"
      role: check menu item
    source_gmail:
      name: "Gmail with Calendar Gmail with Calendar"
      role: check menu item
    source_google_drive:
      name: "Google Drive Google Drive"
      role: check menu item
    source_health:
      name: "Health"
      role: check menu item
    source_social:
      name: "Social"
      role: check menu item
    source_blockscout:
      name: "Blockscout Blockscout"
      role: check menu item
    source_github:
      name: "GitHub GitHub"
      role: check menu item
    # Cloud connectors (menu items — click to connect, not toggles)
    add_files_from_cloud:
      name: "Add files from cloud"
      role: menu item
    manage_connectors:
      name: "Manage Connectors"
      role: menu item
    # Cloud service connectors (below fold — menu items, not toggleable)
    connector_asana:
      name: "Asana Asana"
      role: menu item
    connector_box:
      name: "Box Box"
      role: menu item
    connector_circleback:
      name: "Circleback Circleback"
      role: menu item
    connector_cloudinary:
      name: "Cloudinary Cloudinary"
      role: menu item
    connector_confluence:
      name: "Confluence Confluence"
      role: menu item

    # ─── Model selector ───────────────────────────────────────────────────────
    model_selector:
      name: Model
      role: push button
    model_best:
      name: Best Selects the best available model
      role: radio menu item

    # ─── Response / post-generation controls ─────────────────────────────────
    submit_button:
      name: Submit
      role: push button
      pick: last_by_y
    stop_button:
      name: Stop response (Esc)
      role: push button
    copy_button:
      name: Copy
      role: push button
      states_include:
      - showing
      - enabled
    copy_query_button:
      name: Copy query
      role: push button
    copy_code:
      name: Copy code
      role: push button
    copy_contents_button:
      name: Copy contents
      role: push button
    share_button:
      name: Share
      role: push button
    download_button:
      name: Download
      role: push button
      states_include:
      - showing
    download_markdown_item:
      name: Markdown
      role: menu item
    rewrite_thread:
      name: Rewrite Thread
      role: push button
    helpful:
      name: Helpful
      role: push button
    not_helpful:
      name: Not helpful
      role: push button
    more_actions:
      name: More actions
      role: push button
    thread_actions:
      name: Thread actions
      role: push button

workflow:
  defaults:
    model: best
    mode: deep_research
    tools: []
  full_consult:
    steps:
      attach_trigger:
        elements:
          - attach_trigger
      upload_item:
        elements:
          - upload_files_item
      composer_input:
        elements:
          - input
      submit:
        elements:
          - submit_button
      completion:
        elements:
          - stop_button
      copy_response:
        elements:
          - copy_button
    attachment_present:
      filename_roles:
        - push button
        - section
        - link
        - heading
    select_mode:
      - menu: mode
        option: deep_research
    mode:
      active: deep_research_toggle
      trigger: search_mode_trigger
      option: deep_research
  selection:
    menus:
      model:
        select: single
        active_recognition: checked
        must_choose: true
        resettable_on_followup: true
        operate:
          trigger: model_selector
          scope: menu_snapshot
          open_method: focus_and_key_open
          open_key: space
        options:
          best:
            element: model_best
            click_strategy: atspi_only
        default_for_fresh: best
        example_rationale: Use Best so Perplexity chooses the strongest available model for the consultation.
      mode:
        select: single
        active_recognition: checked
        must_choose: false
        resettable_on_followup: true
        operate:
          trigger: search_mode_trigger
          scope: menu_snapshot
          open_method: focus_and_key_open
          open_key: space
        options:
          deep_research:
            element: deep_research
            active_element: deep_research_toggle
            click_strategy: atspi_only
        default_for_fresh: deep_research
        example_rationale: Use Deep Research for Perplexity because regular Pro Search can return thin or incomplete research.
  attachment:
    trigger: attach_trigger
    menu_target: upload_files_item
    scope: menu_snapshot
    open_method: focus_and_key_open
    open_key: space
  onboarding:
    computer_setup:
      markers:
      - computer_ready
      - computer_personalize
      - computer_notifications
      standard_composer:
      - input
      - attach_trigger
      dismiss_keys:
      - Escape
      detect_timeout_ms: 6000
      settle_ms: 8000
  connectors:
    # Source toggle workflow: open attach dropdown → click git_connector_item
    # → panel opens in portal → use menu_snapshot() for all source items.
    trigger: attach_trigger
    panel_trigger: git_connector_item
    source_targets:
      web: source_web
      academic: source_academic
      gmail: source_gmail
      google_drive: source_google_drive
      health: source_health
      social: source_social
      blockscout: source_blockscout
      github: source_github
  prompt:
    input: input
    send_button: submit_button
  send:
    trigger: submit_button
    require_new_url: true
    stop_key: stop_button
    settle_redirects: true
  monitor:
    stop_key: stop_button
    generation_timeout: 3600
  extract:
    primary_key: copy_button
    strategy: last_by_y
    deep_research:
      trigger: download_button
      open_method: focus_and_key_open
      open_key: space
      target: download_markdown_item
  extra_extract:
    strategy: copy_contents_button
    copy_contents_key: copy_contents_button
settle:
  default_ms: 8000
  navigate_ms: 10000
  attach_ms: 2500
  rescan_attempts: 3

validation:
  attach_success:
    file_chip:
      roles:
      - push button
      - section
      - link
      - heading
  send_success:
    indicators:
    - name: Stop response (Esc)
      role: push button
    timeout: 120
  response_complete:
    stop_absent: stop_button
  deep_research_active:
    indicators:
    - name: Deep research
      role: toggle button
      states_include: [pressed]
  model_council_active:
    indicators:
    - name: "Model council"
      role: push button
  create_files_and_apps_active:
    indicators:
    - name: "Create files and apps"
      role: push button
  learn_step_by_step_active:
    indicators:
    - name: "Learn step by step"
      role: push button
  # No model menu is declared until the model selector dropdown is live-scanned.

# ============================================================================
# extraction — output-type -> ordered exact-matched workflow.
# Schema + load-time validation: consultation_v2/yaml_contract.py;
# grammar doc: consultation_v2/EXTRACTION_SCHEMA.md.
#  - assistant_text: normal answer via the mapped `copy_button`.
#  - Deep Research extraction is owned by the driver's closed Taey consult seat,
#    which captures the citation-bearing body and complete source panel together.
# ============================================================================
extraction:
  assistant_text:
    steps:
      - action: copy_element
        element: copy_button
        select: last
      - action: read_clipboard
        validation: response_complete
