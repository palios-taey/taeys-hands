schema: identity_v1
platform: claude
click_strategy: atspi_only
navigation_key: alt+d
urls:
  fresh: https://claude.ai/new
  verify_navigation: false
native_dialog:
  schema: native_dialog_v1
  root: dialog_root
  max_depth: 32
  elements:
    dialog_root:
      role: file chooser
      scope: firefox_application.direct_child
      capture_name: true
      structural:
        relation: direct_child
        parent_scope: firefox_application
      required_states:
        - showing
        - visible
        - enabled
        - active
    chooser_widget:
      name: File Chooser Widget
      role: file chooser
      scope: native_dialog.chooser
      structural:
        relation: descendant
        anchor: dialog_root
      required_states:
        - showing
        - visible
        - enabled
    location_layer:
      name: Location Layer
      role: filler
      scope: native_dialog.location
      structural:
        relation: descendant
        anchor: chooser_widget
      required: false
      required_states:
        - showing
        - visible
        - enabled
    location_entry:
      name_absent: true
      role: text
      scope: native_dialog.location
      structural:
        relation: direct_child
        anchor: location_layer
      required: false
      capture_text: true
      required_states:
        - showing
        - visible
        - enabled
        - focusable
        - focused
        - editable
    cancel_button:
      name: Cancel
      role: push button
      scope: native_dialog.actions
      structural:
        relation: descendant
        anchor: dialog_root
      required_states:
        - showing
        - visible
        - enabled
        - focusable
    open_button:
      name: Open
      role: push button
      scope: native_dialog.actions
      structural:
        relation: descendant
        anchor: dialog_root
      required_states:
        - showing
        - visible
        - enabled
        - focusable
tree:
  schema: identity_v1
  prune_subtrees:
    - name: Sidebar
      role: landmark
  fence_after:
    - name: Starred
      role: heading
    - name: Recents
      role: push button
  menu_snapshot_scan: document_menu_roles
  menu_snapshot_max_depth: 30
  menu_snapshot_roles:
    - menu item
    - radio menu item
    - check menu item
    - option
  menu_snapshot_exclude:
    names:
      - Undo
      - Redo
      - Cut
      - Copy
      - Paste
      - Paste Without Formatting
      - Delete
      - Select All
      - Check Spelling
      - Inspect
  exclude:
    names:
      - Close sidebar
      - Claude
      - Profile image
      - Sidebar
      - Get apps and extensions
    roles:
      - document web
      - form
      - heading
      - image
      - landmark
      - list
      - list item
      - menu
      - paragraph
      - section
      - separator
      - static
      - status bar
      - tool tip
  sidebar_nav:
    - name: Home
      role: link
    - name: New chat
      role: link
    - name: Search
      role: link
    - name: Search
      role: push button
    - name: Products
      role: push button
    - name: Recents
      role: push button
    - name: Customize
      role: link
    - name: Chats
      role: link
    - name: Projects
      role: link
    - name: Artifacts
      role: link
    - name: Code
      role: link
  conformance:
    scopes:
      base:
        expected:
          - input
          - toggle_menu
          - model_selector
      toggle_menu:
        expected:
          - upload_files_item
          - take_screenshot
          - add_to_project
          - skills
          - tool_research
          - tool_web_search
          - add_connector
          - add_plugins
      model_menu:
        expected:
          - model_opus
          - effort_menu
          - model_more
      model_more_menu:
        expected:
          - model_sonnet
          - model_haiku
          - model_fable
      effort_menu:
        expected:
          - effort_low
          - effort_medium
          - effort_high_default
          - effort_extra
          - effort_max
          - thinking_toggle
      github_modal:
        expected:
          - github_continue_sync
          - github_paste_url
      artifacts:
        expected:
          - artifacts_link
          - artifact_copy_push_button
          - artifact_copy_button
          - artifact_copy_menu_item
          - artifact_copy_contents_push_button
          - artifact_copy_contents_button
          - artifact_copy_contents_menu_item
          - artifact_copy_artifact_push_button
          - artifact_copy_artifact_button
          - artifact_copy_artifact_menu_item
          - artifact_copy_markdown_push_button
          - artifact_copy_markdown_button
          - artifact_copy_markdown_menu_item
          - artifact_copy_markdown_title_push_button
          - artifact_copy_markdown_title_button
          - artifact_copy_markdown_title_menu_item
