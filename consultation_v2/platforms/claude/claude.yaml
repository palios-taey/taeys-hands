workflow:
  navigation:
    postcondition:
      scope: base
      exact_singletons:
        - input
        - model_selector
        - toggle_menu
    observation:
      refresh_policy: invalidate_reacquire
      stable_cycles: 2
      interval_ms: 250
      timeout_ms: 12000
  defaults:
    model: null
    mode: extended_thinking
    tools: none
  full_consult:
    steps:
      attach_trigger:
        elements:
          - toggle_menu
      upload_item:
        elements:
          - upload_files_item
      composer_input:
        elements:
          - input
      submit:
        elements:
          - send_button
      completion:
        elements:
          - stop_button
      copy_response:
        elements:
          - copy_button
        pick: last_by_y
    attachment_present:
      elements:
        - remove_attachment
      pick: first_by_x
    select_mode:
      - menu: model
        option: opus
      - menu: mode
        option: extended_thinking
    failures:
      - network_connection_alert
  selection:
    menus:
      model:
        select: single
        active_recognition: checked
        must_choose: true
        resettable_on_followup: true
        operate:
          trigger: model_selector
          scope: app_root_snapshot
        options:
          opus:
            element: model_opus
            active_trigger_names:
              - 'Model: Opus 5 Extra'
          sonnet:
            element: model_sonnet
            path:
              - element: model_more
                action: click
          haiku:
            element: model_haiku
            path:
              - element: model_more
                action: click
          fable:
            element: model_fable
        default_for_fresh: opus
        example_rationale: Use Opus for deep synthesis, complex audits, and high-stakes mission work.
      mode:
        select: single
        active_recognition: checked
        must_choose: true
        # Claude follow-up sessions cannot safely re-drive the effort submenu.
        resettable_on_followup: false
        operate:
          trigger: model_selector
          scope: app_root_snapshot
        options:
          low:
            element: effort_low
            path:
              - element: effort_menu
                action: hover
          medium:
            element: effort_medium
            path:
              - element: effort_menu
                action: hover
          high:
            element: effort_high_default
            path:
              - element: effort_menu
                action: hover
          extended_thinking:
            element: effort_extra
            active_trigger_names:
              - 'Model: Opus 5 Extra'
            path:
              - element: effort_menu
                action: hover
          max:
            element: effort_max
            path:
              - element: effort_menu
                action: hover
        default_for_fresh: extended_thinking
        example_rationale: Use extended thinking when the prompt requires deeper reasoning than the default high effort.
      tools:
        select: multi
        active_recognition: checked
        must_choose: false
        resettable_on_followup: false
        operate:
          trigger: toggle_menu
          scope: menu_snapshot
        options:
          research:
            element: tool_research
            active_element: research_mode
            click_strategy: atspi_only
          web_search:
            element: tool_web_search
        default_for_fresh: web_search
        example_rationale: Web access is enabled by default; Research remains opt-in for report-style investigations.
  attachment:
    trigger: toggle_menu
    scope: app_root_snapshot
    trigger_click_strategy: atspi_only
    menu_target: upload_files_item
    open_method: keyboard_shortcut
    keyboard_shortcut: ctrl+u
    observation:
      stable_cycles: 2
      interval_ms: 250
      dialog_timeout_ms: 12000
      attachment_timeout_ms: 20000
  prompt:
    input: input
    send_button: send_button
  send:
    trigger: send_button
    stop_keys:
      - stop_button
  monitor:
    stop_keys:
      - stop_button
    generation_timeout: 3600
    exception_states:
      - name: rate_limited
        detect:
          - claude_capacity_alert
          - claude_capacity_alert_pro
          - claude_session_limit_alert
          - claude_hit_limit_alert
        disposition: notify_blocked
        stop_condition: manual_recovery_required
      - name: content_filter
        detect:
          - send_blocked_caution_banner
        disposition: notify_blocked
        stop_condition: manual_recovery_required
      - name: send_blocked
        detect:
          - send_blocked_previous_message
          - send_blocked_previous_message_curly
        disposition: notify_blocked
        stop_condition: manual_recovery_required
      - name: network_error
        detect:
          - claude_not_working_alert
        disposition: notify_blocked
        stop_condition: manual_recovery_required
      - name: quota_limit
        detect:
          - claude_chat_length_limit_alert
        disposition: notify_blocked
        stop_condition: manual_recovery_required
  extract:
    primary_key: copy_button
    strategy: last_by_y
  extra_extract:
    strategy: none
    artifact_copy_keys:
      - artifact_copy_push_button
      - artifact_copy_button
      - artifact_copy_menu_item
      - artifact_copy_contents_push_button
      - artifact_copy_contents_button
      - artifact_copy_contents_menu_item
      - artifact_copy_artifact_push_button
      - artifact_copy_artifact_button
      - artifact_copy_artifact_menu_item
      - artifact_copy_markdown_push_button
      - artifact_copy_markdown_button
      - artifact_copy_markdown_menu_item
      - artifact_copy_markdown_title_push_button
      - artifact_copy_markdown_title_button
      - artifact_copy_markdown_title_menu_item
settle:
  default_ms: 1500
  model_menu_ms: 1000
  effort_menu_reveal_ms: 20000
  navigate_ms: 3500
  attach_ms: 2500
  send_validation_ms: 90000
  rescan_attempts: 1
extraction:
  assistant_text:
    steps:
      - action: scroll_to_bottom
        element: message_actions_button
      - action: hover
        element: message_actions_button
      - action: copy_element
        element: copy_button
        select: last
      - action: read_clipboard
