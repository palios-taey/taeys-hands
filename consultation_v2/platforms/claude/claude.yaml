    send_blocked_previous_message:
      name: Your previous message wasn't sent. You can try again.
      role: alert
      scope: send.blocked
    send_blocked_previous_message_curly:
      name: Your previous message wasn’t sent. You can try again.
      role: alert
      scope: send.blocked
    network_connection_alert:
      name: Warning We couldn’t connect to Claude. Please check your network connection and try again. Close
      role: list item
      scope: response.exception
    send_blocked_caution_banner:
      name: Use caution before running this prompt. Malicious conversation content could trick Claude into attempting harmful actions or sharing your data.
      role: alert
      scope: send.blocked
    claude_capacity_alert:
      name: Due to unexpected capacity constraints, Claude is unable to respond to your message. Please try again soon.
      role: alert
      scope: response.exception
    claude_capacity_alert_pro:
      name: Due to unexpected capacity constraints, Claude is unable to respond to your message. Please try again soon. Or consider upgrading to Claude Pro.
      role: alert
      scope: response.exception
    claude_session_limit_alert:
      name: You've reached your session limit
      role: alert
      scope: response.exception
    claude_hit_limit_alert:
      name: You hit your limit
      role: alert
      scope: response.exception
    claude_not_working_alert:
      name: This isn't working right now. You can try again later.
      role: alert
      scope: response.exception
    claude_chat_length_limit_alert:
      name: Your message will exceed the length limit for this chat
      role: alert
      scope: response.exception
    copy_button:
      name: Copy
      role: push button
      scope: response.actions
    chat_messages_panel:
      name: Chat messages
      role: panel
      scope: response.document
    current_response_article:
      role: article
      scope: response.document
      match_strategy: name_agnostic_structural
      structural:
        parent: chat_messages_panel
        ordinal: last
      reason: Claude numbers each message article dynamically; the current response is the last article under the exact Chat messages panel.
    message_actions_button:
      role: tool bar
      scope: response.actions
      match_strategy: name_agnostic_structural
      structural:
        parent: current_response_article
        ordinal: last
      reason: Claude exposes the current-response actions as the direct tool-bar child of the exact current response article.
    response_content_section:
      role: section
      scope: response.document
      match_strategy: name_agnostic_structural
      structural:
        parent: current_response_article
        ordinal: first
      reason: The current response article's first section owns its rendered response content.
    generated_artifact_controls_section:
      role: section
      scope: response.document
      match_strategy: name_agnostic_structural
      structural:
        parent: response_content_section
        ordinal: last
        direct_child_roles:
          - push button
          - section
          - section
          - push button
          - push button
        required_direct_child:
          index: 3
          name: Open in Drive
          role: push button
      reason: A generated artifact is rendered in the last response-content section; the container has no accessible name.
    generated_artifact_view_button:
      role: push button
      scope: response.document
      match_strategy: name_agnostic_structural
      structural:
        parent: generated_artifact_controls_section
        ordinal: first
      reason: Claude includes the generated artifact title in this button's accessible name; it is the first push button in the exact artifact-controls section.
    generated_artifact_download_button:
