platform: linkedin
click_strategy: atspi_only
urls:
  fresh: https://www.linkedin.com/jobs/
  verify_navigation: false
settle:
  default_ms: 0
  navigate_ms: 0
  attach_ms: 0
  rescan_attempts: 1
tree:
  fence_after: []
  menu_snapshot_roles: []
  menu_snapshot_exclude:
    names: []
  exclude:
    names: []
    roles:
      - separator
      - document web
  sidebar_nav: []
  element_map:
    about_job_heading:
      name: About the job
      role: heading
      scope: jobs.selected_detail
workflow:
  selected_job_read:
    operation: capture_selected_job
    observation: canonical_snapshot_anchor
    required_elements:
      - about_job_heading
    description_traversal:
      - relation: parent
        role: section
      - relation: child
        index: 1
        role: paragraph
      - relation: child
        index: 0
        role: section
    description_interface: atspi_text
    action: private_sink_write_once
    postcondition: selected_job_content_digest_unchanged
validation:
  selected_job_ready:
    indicators:
      - about_job_heading
