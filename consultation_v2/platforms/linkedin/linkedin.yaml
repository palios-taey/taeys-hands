platform: linkedin
click_strategy: atspi_only
urls:
  fresh: https://www.linkedin.com/jobs/
  verify_navigation: false
settle:
  default_ms: 0
  navigate_ms: 0
  attach_ms: 0
  rescan_attempts: 1
tree:
  fence_after: []
  menu_snapshot_roles: []
  menu_snapshot_exclude:
    names: []
  exclude:
    names: []
    roles:
      - separator
      - document web
  sidebar_nav: []
  element_map:
    about_job_heading:
      name: About the job
      role: heading
      scope: jobs.selected_detail
    my_posts_filter:
      name: My posts
      role: radio button
      states_include:
        - showing
      action:
        name: press
        index: 0
    selected_filter_marker:
      name: My posts’ filters
      role: push button
      states_include:
        - showing
workflow:
  mounted_job_search_read:
    operation: capture_mounted_job_search
    route:
      scheme: https
      host: www.linkedin.com
      normalized_path: /jobs/search-results
    card:
      role: push button
      states_include:
        - enabled
      action_names_exact:
        - click
      direct_child_roles_prefix:
        - section
        - paragraph
        - paragraph
        - push button
        - section
      minimum_direct_children: 6
      title:
        child_index: 3
        role: push button
        exact_prefix: "Dismiss "
        exact_suffix: " job"
      company:
        child_index: 1
        role: paragraph
        interface: atspi_text
      location:
        child_index: 2
        role: paragraph
        interface: atspi_text
    observation_barrier:
      projection: exact_route_and_mounted_job_card_set
      refresh_policy: invalidate_reacquire
      stable_cycles: 2
      interval_ms: 200
      timeout_ms: 10000
    action: private_sink_write_once
    postcondition: mounted_job_card_set_digest_unchanged
  job_selection:
    operation: select_and_capture_job
    observation: canonical_snapshot_private_exact_name
    target_card:
      role: push button
      states_include:
        - showing
        - enabled
    action:
      interface: atspi_action
      name: click
    detail_title:
      role: link
      states_include:
        - showing
        - enabled
    detail_company:
      role: link
      states_include:
        - showing
        - enabled
    observation_barrier:
      refresh_policy: invalidate_reacquire
      stable_cycles: 2
      interval_ms: 200
      timeout_ms: 10000
    postcondition: private_exact_detail_identity_and_selected_job
  selected_job_read:
    operation: capture_selected_job
    observation: canonical_snapshot_anchor
    required_elements:
      - about_job_heading
    description_traversal:
      - relation: parent
        role: section
      - relation: child
        index: 1
        role: paragraph
      - relation: child
        index: 0
        role: section
    description_interface: atspi_text
    action: private_sink_write_once
    postcondition: selected_job_content_digest_unchanged
  engagement_signal_capture:
    operation: capture_visible_new_engagement_signal
    routes:
      jobs:
        scheme: https
        host: www.linkedin.com
        normalized_path: /jobs/search-results
      notifications_all:
        scheme: https
        host: www.linkedin.com
        normalized_path: /notifications
        exact_query:
          filter: all
      notifications_my_posts:
        scheme: https
        host: www.linkedin.com
        normalized_path: /notifications
        exact_query:
          filter: my_posts_all
    navigation:
      target:
        scope: current_platform_document
        role: link
        states_include:
          - showing
          - enabled
        uri:
          scheme: https
          host: www.linkedin.com
          normalized_path: /notifications
      action:
        name: jump
        index: 0
      observation_barrier:
        projection: exact_route_and_my_posts_state
        refresh_policy: invalidate_reacquire
        stable_cycles: 2
        interval_ms: 200
        timeout_ms: 10000
      manual_post_action:
        element_key: notifications_navigation
        operation: activate
        postcondition:
          projection: exact_route
          route_key: notifications_all
        observation_barrier:
          refresh_policy: invalidate_reacquire
          stable_cycles: 2
          interval_ms: 200
          timeout_ms: 10000
    candidate_observation:
      observation_name_prefix: Unread notification.
      role: link
      states_include:
        - showing
      allowed_uri_normalized_path_prefixes:
        - /feed/
        - /posts/
      authority: observation_classification_only
    manual_notification_selection:
      route_key: notifications_all
      article_names:
        - Notification
        - Notification.
        - Unread notification.
      candidate:
        name_prefix: Unread notification.
        role: link
        states_include:
          - enabled
          - focusable
        uri:
          scheme: https
          host: www.linkedin.com
          normalized_path: /feed
          activity_query_key: highlightedUpdateUrn
          activity_prefix: "urn:li:activity:"
      relative_age:
        role: paragraph
        units:
          - s
          - m
          - h
          - d
          - w
      categories:
        - All
        - Jobs
        - My posts
        - Mentions
      selection_policy:
        order: newest_first
        max_age_hours: 72
        author_cooloff_hours: 48
        filter_after_ordered_observation: true
        cooloff_source: private_careers_activity_database
        continue_only_when_all_mounted_candidates_are_evidenced_excluded: true
      continuation:
        name: Show more results
        role: push button
        states_include:
          - enabled
          - focusable
      selected_activity_postcondition:
        identity_sources:
          - document_url
          - showing_link_uri
        showing_link:
          role: link
          states_include:
            - showing
        exact_activity_identity_count: 1
      selected_post_observation:
        element_key_prefix: selected_post_activity_
        root:
          role: list item
          states_include:
            - showing
          exact_match_count: 1
        heading:
          index_path:
            - 0
            - 0
          role: heading
          name: Feed post
        body:
          index_path:
            - 0
            - 8
            - 0
          role: section
          states_include:
            - showing
          content_digest: sha256_utf8
        operation:
          effect_class: observation
          primitives: []
          allowed_now: []
      selected_thread:
        open_element_key_prefix: selected_post_thread_open_activity_
        comment_count:
          role: push button
          index_path:
            - 0
            - 11
          states_include:
            - enabled
            - focusable
        visible_comment:
          role: push button
          name_prefix: View more options for
          name_suffix: comment.
        action:
          effect_class: page
          primitives:
            - mapped_pointer_activate
          allowed_now:
            - mapped_pointer_activate
        scroll_into_view:
          effect_class: viewport
          primitives:
            - scroll_into_view
          allowed_now:
            - scroll_into_view
          postcondition: exact_selected_thread_opener_in_viewport
          observation_barrier:
            refresh_policy: invalidate_reacquire
            stable_cycles: 2
            interval_ms: 200
            timeout_ms: 10000
        postcondition: exact_selected_activity_visible_comment_controls
      observation_barrier:
        refresh_policy: invalidate_reacquire
        stable_cycles: 2
        interval_ms: 200
        timeout_ms: 10000
    observation_barrier:
      projection: exact_route_marker_and_candidate_set
      refresh_policy: invalidate_reacquire
      stable_cycles: 2
      interval_ms: 200
      timeout_ms: 10000
    candidate_cardinality:
      no_new_signal: 0
      capture: 1
      ambiguous_signal_minimum: 2
    sink_action: private_sink_write_once
    postcondition: selected_signal_content_digest_unchanged
    restore:
      navigation_key: ctrl+l
      address_bar:
        key: address_bar
        name: Search with Google or enter address
        role: entry
        states_include:
          - editable
          - focusable
      submit_key: Return
      observation_barrier:
        projection: exact_return_route_and_current_notifications_state
        refresh_policy: invalidate_reacquire
        stable_cycles: 2
        interval_ms: 200
        timeout_ms: 10000
validation:
  selected_job_ready:
    indicators:
      - about_job_heading
