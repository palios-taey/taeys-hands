platform: linkedin
click_strategy: atspi_only
urls:
  fresh: https://www.linkedin.com/jobs/
  verify_navigation: false
settle:
  default_ms: 0
  navigate_ms: 0
  attach_ms: 0
  rescan_attempts: 1
tree:
  fence_after: []
  menu_snapshot_roles: []
  menu_snapshot_exclude:
    names: []
  exclude:
    names: []
    roles:
      - separator
      - document web
  sidebar_nav: []
  element_map:
    about_job_heading:
      name: About the job
      role: heading
      scope: jobs.selected_detail
workflow:
  job_selection:
    operation: select_and_capture_job
    observation: canonical_snapshot_private_exact_name
    target_card:
      role: push button
      states_include:
        - showing
        - enabled
    action: atspi_activate
    detail_title:
      role: link
      states_include:
        - showing
        - enabled
    detail_company:
      role: link
      states_include:
        - showing
        - enabled
    observation_barrier:
      refresh_policy: invalidate_reacquire
      stable_cycles: 2
      interval_ms: 200
      timeout_ms: 10000
    postcondition: private_exact_detail_identity_and_selected_job
  selected_job_read:
    operation: capture_selected_job
    observation: canonical_snapshot_anchor
    required_elements:
      - about_job_heading
    description_traversal:
      - relation: parent
        role: section
      - relation: child
        index: 1
        role: paragraph
      - relation: child
        index: 0
        role: section
    description_interface: atspi_text
    action: private_sink_write_once
    postcondition: selected_job_content_digest_unchanged
validation:
  selected_job_ready:
    indicators:
      - about_job_heading
