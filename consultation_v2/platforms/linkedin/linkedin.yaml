platform: linkedin
click_strategy: atspi_only
urls:
  fresh: https://www.linkedin.com/jobs/
  verify_navigation: false
settle:
  default_ms: 0
  navigate_ms: 0
  attach_ms: 0
  rescan_attempts: 1
tree:
  fence_after: []
  menu_snapshot_roles: []
  menu_snapshot_exclude:
    names: []
  exclude:
    names: []
    roles:
      - separator
      - document web
  sidebar_nav: []
  element_map:
    about_job_heading:
      name: About the job
      role: heading
      scope: jobs.selected_detail
    my_posts_filter:
      name: My posts
      role: radio button
      states_include:
        - showing
      action:
        name: press
        index: 0
    selected_filter_marker:
      name: My posts’ filters
      role: push button
      states_include:
        - showing
workflow:
  mounted_job_search_read:
    operation: capture_mounted_job_search
    route:
      scheme: https
      host: www.linkedin.com
      normalized_path: /jobs/search-results
    card:
      role: push button
      states_include:
        - enabled
      action_names_exact:
        - click
      direct_child_roles_prefix:
        - section
        - paragraph
        - paragraph
        - push button
        - section
      minimum_direct_children: 6
      title:
        child_index: 3
        role: push button
        exact_prefix: "Dismiss "
        exact_suffix: " job"
      company:
        child_index: 1
        role: paragraph
        interface: atspi_text
      location:
        child_index: 2
        role: paragraph
        interface: atspi_text
    observation_barrier:
      projection: exact_route_and_mounted_job_card_set
      refresh_policy: invalidate_reacquire
      stable_cycles: 2
      interval_ms: 200
      timeout_ms: 10000
    action: private_sink_write_once
    postcondition: mounted_job_card_set_digest_unchanged
  job_selection:
    operation: select_and_capture_job
    observation: canonical_snapshot_private_exact_name
    target_card:
      role: push button
      states_include:
        - showing
        - enabled
    action:
      interface: atspi_action
      name: click
    detail_title:
      role: link
      states_include:
        - showing
        - enabled
    detail_company:
      role: link
      states_include:
        - showing
        - enabled
    observation_barrier:
      refresh_policy: invalidate_reacquire
      stable_cycles: 2
      interval_ms: 200
      timeout_ms: 10000
    postcondition: private_exact_detail_identity_and_selected_job
  selected_job_read:
    operation: capture_selected_job
    observation: canonical_snapshot_anchor
    required_elements:
      - about_job_heading
    description_traversal:
      - relation: parent
        role: section
      - relation: child
        index: 1
        role: paragraph
      - relation: child
        index: 0
        role: section
    description_interface: atspi_text
    action: private_sink_write_once
    postcondition: selected_job_content_digest_unchanged
  engagement_signal_capture:
    operation: capture_visible_new_engagement_signal
    routes:
      jobs:
        scheme: https
        host: www.linkedin.com
        normalized_path: /jobs/search-results
      notifications_all:
        scheme: https
        host: www.linkedin.com
        normalized_path: /notifications
        exact_query:
          filter: all
      notifications_my_posts:
        scheme: https
        host: www.linkedin.com
        normalized_path: /notifications
        exact_query:
          filter: my_posts_all
    navigation:
      target:
        scope: exact_linkedin_navigation_preload_document
        ancestor_document:
          scheme: https
          host: www.linkedin.com
          normalized_path: /preload
          exact_query:
            _bprMode: vanilla
        role: link
        states_required:
          - enabled
          - focusable
          - showing
        allowed_optional_states:
          - focused
        uri:
          scheme: https
          host: www.linkedin.com
          normalized_path: /notifications
          exact_query_variants:
            - {}
            - filter: all
              refresh: "true"
        action_names_exact:
          - jump
      action:
        name: jump
        index: 0
      initial_observation_barrier:
        projection: exact_notifications_navigation
        refresh_policy: invalidate_reacquire
        stable_cycles: 2
        interval_ms: 200
        timeout_ms: 45000
      observation_barrier:
        projection: exact_route_and_my_posts_state
        refresh_policy: invalidate_reacquire
        stable_cycles: 2
        interval_ms: 200
        timeout_ms: 10000
      manual_post_action:
        element_key: notifications_navigation
        operation: activate
        postcondition:
          projection: exact_route_and_all_category
          route_key: notifications_all
        observation_barrier:
          refresh_policy: invalidate_reacquire
          stable_cycles: 2
          interval_ms: 200
          timeout_ms: 10000
    candidate_observation:
      observation_name_prefix: Unread notification.
      role: link
      states_include:
        - showing
      allowed_uri_normalized_path_prefixes:
        - /feed/
        - /posts/
      authority: observation_classification_only
    manual_notification_selection:
      route_key: notifications_all
      article_names:
        - Notification
        - Notification.
        - Unread notification.
      article_structure:
        direct_child_roles_exact:
          - link
          - link
          - paragraph
          - section
        content_link_direct_child_index: 1
      candidate:
        name_prefix: Unread notification.
        role: link
        states_include:
          - enabled
          - focusable
        uri:
          scheme: https
          host: www.linkedin.com
          normalized_path: /feed
          activity_query_key: highlightedUpdateUrn
          activity_prefix: "urn:li:activity:"
      relative_age:
        role: paragraph
        units:
          - s
          - m
          - h
          - d
          - w
      categories:
        - All
        - Jobs
        - My posts
        - Mentions
      selection_policy:
        order: newest_first
        max_age_hours: 72
        author_cooloff_hours: 48
        filter_after_ordered_observation: true
        cooloff_source: private_careers_activity_database
        continue_only_when_all_mounted_candidates_are_evidenced_excluded: true
      continuation:
        name: Show more results
        role: push button
        states_include:
          - enabled
          - focusable
        postcondition:
          kind: notification_stream_stable_novelty
          action_identity: stable_semantic_key
          identity: exact_yaml_content_link_uri
          pre_action_freeze: exact_live_target_ref_revalidation
          frozen_inventory_digest: sha256_uri_digests_truncated_16
          frozen_inventory_members: sha256_uri_digests
          novelty: at_least_one_exact_unseen_identity
          candidate_projection: exact_separate
      selected_activity_postcondition:
        identity_sources:
          - document_url
          - showing_link_uri
        showing_link:
          role: link
          states_include:
            - showing
        exact_activity_identity_count: 1
      selected_post_observation:
        element_key_prefix: selected_post_activity_
        root:
          role: list item
          states_include:
            - showing
          exact_match_count: 1
        heading:
          index_path:
            - 0
            - 0
          role: heading
          name: Feed post
        body:
          index_paths:
            -
              - 0
              - 9
              - 0
            -
              - 0
              - 12
              - 0
          role: section
          states_include:
            - showing
          content_digest: sha256_utf8
        operation:
          effect_class: observation
          primitives: []
          allowed_now: []
      selected_thread:
        open_element_key_prefix: selected_post_thread_open_activity_
        zero_open_element_key_prefix: selected_post_zero_thread_open_activity_
        expand_element_key_prefix: selected_post_thread_expand_activity_
        comment_count:
          role: push button
          index_paths:
            -
              - 0
              - 12
            -
              - 0
              - 15
          states_include:
            - enabled
            - focusable
        visible_comment:
          role: push button
          name_prefix: View more options for
          name_suffix: comment.
        zero_open:
          body_index_path:
            - 0
            - 9
            - 0
          index_path:
            - 0
            - 15
          role: push button
          name: Comment
          states_include:
            - showing
            - enabled
            - focusable
          action:
            effect_class: page
            primitives:
              - mapped_pointer_activate
            allowed_now:
              - mapped_pointer_activate
          postcondition: exact_selected_activity_zero_comment_thread_open
        expand:
          role: push button
          relative_depth: 2
          name_prefix: "See "
          name_suffixes:
            - " more comment"
            - " more comments"
          states_include:
            - enabled
            - focusable
          action:
            effect_class: page
            primitives:
              - mapped_pointer_activate
            allowed_now:
              - mapped_pointer_activate
          postcondition: exact_selected_thread_growth
          scroll_into_view:
            effect_class: viewport
            primitives:
              - scroll_into_view
            allowed_now:
              - scroll_into_view
            postcondition: exact_selected_thread_expander_in_viewport
            observation_barrier:
              refresh_policy: invalidate_reacquire
              stable_cycles: 2
              interval_ms: 200
              timeout_ms: 10000
        action:
          effect_class: page
          primitives:
            - mapped_pointer_activate
          allowed_now:
            - mapped_pointer_activate
        scroll_into_view:
          effect_class: viewport
          primitives:
            - scroll_into_view
          allowed_now:
            - scroll_into_view
          postcondition: exact_selected_thread_opener_in_viewport
          observation_barrier:
            refresh_policy: invalidate_reacquire
            stable_cycles: 2
            interval_ms: 200
            timeout_ms: 10000
        postcondition: exact_selected_activity_visible_comment_controls
      observation_barrier:
        refresh_policy: invalidate_reacquire
        stable_cycles: 2
        interval_ms: 200
        timeout_ms: 10000
    manual_comment_composition:
      selected_post_identity:
        activity_source: exact_selected_activity
        body_digest: sha256_utf8
      reaction:
        element_key_prefix: selected_post_reaction_activity_
        role: push button
        relative_depth: 2
        exact_names:
          no_reaction: "Reaction button state: no reaction"
          liked: "Reaction button state: Like"
        action:
          effect_class: outward
          primitives:
            - activate_optional_like
          allowed_now:
            - activate_optional_like
        postcondition: exact_same_activity_body_reaction_like
      editor:
        element_key_prefix: selected_post_editor_activity_
        name: Text editor for creating comment
        role: entry
        relative_depth: 5
        states_include:
          - editable
          - focusable
          - visible
          - sensitive
        ready_states_include:
          - showing
        max_text_chars: 1800
        text_child:
          role: paragraph
          parent_text: "\uFFFC"
          empty_texts:
            - "Add a comment..."
            - "Add a comment...\n"
          states_include:
            - editable
            - visible
            - sensitive
        action:
          effect_class: draft
          primitives:
            - paste_frozen_text
          allowed_now:
            - paste_frozen_text
        postcondition: exact_same_activity_body_editor_text_sha256
      submit:
        element_key_prefix: selected_post_submit_activity_
        name: Comment
        role: push button
        relative_depth: 4
        states_include:
          - focusable
          - showing
          - visible
          - sensitive
        action:
          effect_class: outward
          primitives:
            - submit_frozen_comment
          allowed_now:
            - submit_frozen_comment
        precondition: exact_unsent_draft_on_same_activity_body
        postcondition: exact_comment_delivery
      own_comment:
        control_name_prefix: "View more options for "
        control_name_suffixes:
          - "\u2019s comment."
          - "\u2019 comment."
        role: push button
        relative_depth: 5
        states_include:
          - enabled
          - focusable
        relative_text:
          root_distance: 2
          root_role: section
          child_path:
            - 2
            - 0
            - 0
            - 0
          role: section
          max_text_chars: 1800
      observation_barrier:
        refresh_policy: invalidate_reacquire
        stable_cycles: 2
        interval_ms: 200
        timeout_ms: 10000
    observation_barrier:
      projection: exact_route_marker_and_candidate_set
      refresh_policy: invalidate_reacquire
      stable_cycles: 2
      interval_ms: 200
      timeout_ms: 10000
    candidate_cardinality:
      no_new_signal: 0
      capture: 1
      ambiguous_signal_minimum: 2
    sink_action: private_sink_write_once
    postcondition: selected_signal_content_digest_unchanged
    restore:
      navigation_key: ctrl+l
      address_bar:
        key: address_bar
        name: Search with Google or enter address
        role: entry
        states_include:
          - editable
          - focusable
      submit_key: Return
      observation_barrier:
        projection: exact_return_route_and_current_notifications_state
        refresh_policy: invalidate_reacquire
        stable_cycles: 2
        interval_ms: 200
        timeout_ms: 10000
validation:
  selected_job_ready:
    indicators:
      - about_job_heading
