platform: gemini
click_strategy: atspi_only
urls:
  fresh: https://gemini.google.com/u/1/app?pageId=none
  verify_navigation: false
tree:
  prune_subtrees:
    - name: Side Navigation
      role: landmark
  fence_after:
  - name: Chats
    role: heading
  menu_snapshot_roles:
    - menu item
    - radio menu item
    - check menu item
    - option
  menu_snapshot_exclude:
    names:
    - Undo
    - Redo
    - Cut
    - Copy
    - Paste
    - Paste Without Formatting
    - Delete
    - Select All
    - Check Spelling
    - Inspect
  exclude:
    names:
    - Gemini
    - Gemini Apps Activity
    - Manage extensions
    - tap to use tool
    roles:
    - separator
    - document web
    - paragraph
  sidebar_nav:
  - name: New chat
    role: link
  - name: New chat
    role: push button
  - name: Main menu
    role: push button
  - name: Search
    role: push button
  - name: Projects
    role: push button
  - name: History
    role: push button
  - name: Chats
    role: heading
  element_map:
    input:
      name: Enter a prompt for Gemini
      role: entry
      states_include:
      - editable
    mode_picker:
      names_any_of:
        - Open mode picker, currently Flash
        - Open mode picker, currently Pro
        - Open mode picker, currently Pro Extended
        - Open mode picker, currently Pro Deep Think
      role: push button
      match_strategy: name_agnostic_structural
      structural:
        after: input
      reason: Gemini's model picker visible name changes with the selected model; live labels are enumerated exactly, and the structural anchor prevents a stale enum from binding an unrelated push button.
    # Gemini merged "Tools" and the upload menu into one "Upload & tools"
    # button (UI 2026-05-21). Both keys reference the same live element.
    tools_button:
      name: Upload & tools
      role: push button
    upload_menu:
      name: Upload & tools
      role: push button
    # Gemini's current model picker contains the 3.1 Pro base model followed by
    # its exact Extended and Deep Think reasoning choices. Deep Research remains
    # a separate Upload & tools option and requires Pro Extended.
    copy_button:
      name: Copy
      role: push button
    stop_button:
      name: Stop response
      role: push button
    send_button:
      name: Send message
      role: push button
    share_export:
      name: Share & Export
      role: push button
      scope: app_root_snapshot
    # The Deep Research report renders in a canvas/immersive panel; the FULL
    # report is copied via Share & Export -> "Copy" (a menu item in the popover,
    # NOT the chat-bubble Copy push button which only yields the ~89-char "I've
    # completed your research" stub). Verified live 2026-06-15.
    copy_content_item:
      name: Copy
      role: menu item
      scope: snapshot
    start_research:
      name: Start research
      role: push button
    microphone:
      name: Microphone
      role: push button
    new_chat:
      name: New chat
      role: link
    # BUG 4 FIX: exact AT-SPI name for upload dropdown item
    upload_files_item:
      name: "Upload files. Documents, data, code files"
      role: menu item
    # BUG 4 FIX: exact AT-SPI name for Drive item
    add_from_drive_item:
      name: "Add from Drive. Sheets, Docs, Slides"
      role: menu item
    import_code_item:
      name: Import code
      role: menu item
    notebooklm_item:
      name: NotebookLM
      role: menu item
    mode_fast:
      name: "3.7 Flash All-around help New"
      role: menu item
    mode_pro:
      name: "3.1 Pro Advanced reasoning"
      role: menu item
    mode_extended:
      name: "Extended thinking Complex problem solving"
      role: menu item
    mode_deep_think:
      name: "Deep Think Max parallel reasoning"
      role: menu item
    # BUG 2 FIX: all tool items are check menu item, not menu item
    # BUG 3 FIX: tool_create_image exact AT-SPI name includes "New"
    tool_create_image:
      name: "Create image New"
      role: check menu item
    tool_canvas:
      name: Canvas
      role: check menu item
    tool_deep_research:
      name: Deep research
      role: check menu item
      scope: tools_menu
    # BUG 5 FIX: three new tool entries present in live AT-SPI scan
    tool_create_video:
      name: Create video
      role: check menu item
    tool_create_music:
      name: "Create music New"
      role: check menu item
    tool_guided_learning:
      name: Guided learning
      role: check menu item
    tool_deselect_deep_research:
      name: Deselect Deep research
      role: push button
    # Gemini Deep Think interim ACK from the real Jun-14 AT-SPI dump:
    # name "Deep Think Response In Progress", role link, states showing/focusable/enabled.
    deep_think_interim_ack_placeholder:
      name: Deep Think Response In Progress
      role: link
      states_include:
      - showing
      - focusable
      - enabled
workflow:
  defaults:
    model: pro
    mode: deep_think
    tools: none
  full_consult:
    steps:
      attach_trigger:
        elements:
          - upload_menu
      upload_item:
        elements:
          - upload_files_item
      composer_input:
        elements:
          - input
        paste_strategy: focus_and_paste
      submit:
        elements:
          - send_button
        action: focus_and_key
        key: space
      post_submit:
        elements:
          - start_research
      completion:
        elements:
          - stop_button
      copy_response:
        elements:
          - copy_button
        pick: last_by_y
    attachment_present:
      filename_value: stem
      filename_roles:
        - section
    select_mode:
      - menu: model
        option: pro
      - menu: mode
        option: deep_think
  selection:
    menus:
      model:
        select: single
        active_recognition: selected_name_prefix
        must_choose: false
        resettable_on_followup: true
        operate:
          trigger: mode_picker
          scope: menu_snapshot
        options:
          fast:
            element: mode_fast
            active_trigger_names:
              - Open mode picker, currently Flash
          pro:
            element: mode_pro
            active_trigger_names:
              - Open mode picker, currently Pro
              - Open mode picker, currently Pro Extended
              - Open mode picker, currently Pro Deep Think
        default_for_fresh: pro
        example_rationale: Use Gemini 3.1 Pro as the base model for Extended, Deep Think, and Deep Research work.
      mode:
        select: single
        active_recognition: selected_name_prefix
        must_choose: false
        resettable_on_followup: true
        operate:
          trigger: mode_picker
          scope: menu_snapshot
        options:
          extended:
            element: mode_extended
            active_trigger_names:
              - Open mode picker, currently Pro Extended
          deep_think:
            element: mode_deep_think
            active_trigger_names:
              - Open mode picker, currently Pro Deep Think
        default_for_fresh: deep_think
        example_rationale: Deep Think is the maximum parallel-reasoning option; Extended is required before enabling Deep Research.
      tools:
        select: multi
        active_recognition: checked
        must_choose: false
        resettable_on_followup: true
        operate:
          trigger: tools_button
          scope: menu_snapshot
        options:
          deep_research:
            element: tool_deep_research
            active_element: tool_deselect_deep_research
        default_for_fresh: none
        example_rationale: Deep Research is a separate Upload & tools capability and is only valid with mode=extended.
  attachment:
    trigger: upload_menu
    menu_target: upload_files_item
    scope: menu_snapshot
    open_method: focus_and_key_open
    open_key: space
  prompt:
    input: input
    send_button: send_button
  send:
    trigger: send_button
    require_new_url: false
    stop_key: stop_button
    post_send_key: start_research
  monitor:
    stop_key: stop_button
    generation_timeout: 3600
    deep_think_interim_ack_key: deep_think_interim_ack_placeholder
  extract:
    primary_key: copy_button
    strategy: last_by_y
  extra_extract:
    strategy: share_export_copy_content
    share_export_key: share_export
    copy_content_key: copy_content_item
settle:
  default_ms: 2000
  selection_ms: 8000
  mode_picker_menu_ms: 3000
  mode_picker_menu_reveal_ms: 20000
  navigate_ms: 4000
  attach_ms: 3000
  rescan_attempts: 1
validation:
  attach_success:
    # Live post-Deep-Think chips expose the filename in description on a section.
    file_chip:
      roles:
      - section
  prompt_ready:
    indicators:
    - name: Send message
      role: push button
  send_success:
    indicators:
    - name: Stop response
      role: push button
    timeout: 30
  # response_complete: the stop button is GONE (persistent-element gate).
  response_complete:
    stop_absent: stop_button
  # BUG 7 FIX: mode validation uses checked state, not selected
  fast_active:
    indicators:
    - name: 3.5 Flash
      states_include: [checked]
  thinking_active:
    indicators:
    - name: 3.5 Thinking
      states_include: [checked]
  # PRE-SEND indicator that Deep Research is engaged: the composer shows a
  # "Deselect Deep research" toggle button (mirrors "Deselect Deep think").
  # The old "Start research"/"Share & export" buttons only appear on the
  # RESULTS page AFTER the DR query is sent, so validating them at select-mode
  # time (pre-send) always failed and ABORTED the run before it could send
  # (Jesse-corrected: code audits run in Deep Research; this gate blocked it).
  deep_research_active:
    indicators:
    - name: Deselect Deep research
      role: push button
  canvas_active:
    indicators:
    - name: Canvas
      states_include: [checked]

# ============================================================================
# extraction — output-type -> ordered exact-matched workflow.
# Schema + load-time validation: consultation_v2/yaml_contract.py;
# grammar doc: consultation_v2/EXTRACTION_SCHEMA.md.
#  - assistant_text: normal chat response via the mapped `copy_button`.
#  - research_report: Deep Research renders the full report in a canvas panel
#    whose body the chat-bubble Copy MISSES (yields the ~89-char "I've completed
#    your research" stub). The full report is `share_export` (push button) ->
#    `copy_content_item` (Copy menu item). Production-proven on :4 (36KB report
#    vs 89 chars); share_export is clicked first to open the popover.
# ============================================================================
extraction:
  assistant_text:
    steps:
      - action: copy_element
        element: copy_button
        select: last
      - action: read_clipboard
        validation: response_complete
  research_report:
    steps:
      - action: click
        element: share_export
      - action: copy_element
        element: copy_content_item
      - action: read_clipboard
        validation: response_complete
