name: YAML Integrity Gate

on:
  pull_request:
  push:
    branches:
      - main
      - consultation-v2-isolated-drivers
      - 'agent/**'
      - 'fix/**'
      - 'feat/**'
      - 'platform-independence-*'

jobs:
  consultation-v2-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install gate dependencies
        run: pip install pyyaml

      - name: Run consultation_v2 integrity gate
        run: python3 consultation_v2/validators/lint_no_yaml_silent_fallbacks.py --all

      - name: Run consultation_v2 contract gate
        run: python3 consultation_v2/validators/lint_consultation_v2_contract.py --all

      - name: Prove mapped-pointer contract allow/reject cases
        run: python3 consultation_v2/validators/lint_consultation_v2_contract.py --self-test

      - name: Run consultation_v2 platform isolation gate
        run: python3 consultation_v2/validators/lint_platform_independence.py --all

      - name: Prove Grok attachment semantic operation contract
        run: python3 consultation_v2/validators/validate_grok_manual_attachment_contract.py

      - name: Prove Claude semantic attachment shortcut contract
        run: python3 consultation_v2/validators/validate_claude_semantic_shortcut_contract.py

      - name: Prove Claude generated-artifact download contract
        run: python3 consultation_v2/validators/validate_claude_manual_extraction_contract.py

      - name: Prove Perplexity attachment semantic operation contract
        run: python3 consultation_v2/validators/validate_perplexity_manual_attachment_contract.py

      - name: Prove Perplexity final-response download selection contract
        run: python3 consultation_v2/validators/validate_perplexity_manual_extraction_contract.py

      - name: Prove LinkedIn selected-thread viewport contract
        run: python3 consultation_v2/validators/validate_linkedin_manual_notification_contract.py

      - name: Run supervised UI design-rule public contract gate
        run: python3 consultation_v2/validators/validate_supervised_ui_design_rules.py --self-check

      - name: Prove ATS provider read-only boundary
        run: python3 consultation_v2/validators/validate_ats_provider_read_only.py
